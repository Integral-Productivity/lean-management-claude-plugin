# Skill layer fitness function (ADR-0004, decision 3).
#
# Fails when a skill declares no layer, more than one layer, or an unknown
# layer. The tests for the check run in the A3 format workflow (scripts/*.test.mjs).
# No secrets.

name: Skill layers

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Skill layers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check skill layers
        run: node scripts/check-layers.mjs
